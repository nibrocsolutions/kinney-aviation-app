<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f3a" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Kinney Aviation shop records, billing, calendar, and owner presentation." />
  <title>Kinney Aviation</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div id="login" class="login">
    <form id="login-form" class="login-card">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path fill="currentColor" d="M4 22c8-1 14-6 18-12l2 4c-3 5-8 9-16 11l-1 7H4V22zm22-8l10 3-2 2-6-1-4 6-3-1 3-7 2-2z"/>
      </svg>
      <p class="eyebrow">Kinney Aviation</p>
      <h1>Sign in</h1>
      <p class="login-lead">Records, billing, and the day’s schedule for the shop.</p>
      <label>Username
        <input name="username" autocomplete="username" required maxlength="32" />
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <p id="login-note" class="login-note" hidden></p>
      <p id="login-error" class="form-error" hidden></p>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <aside class="rail">
      <a class="brand" href="#briefing">
        <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true">
          <path fill="currentColor" d="M4 22c8-1 14-6 18-12l2 4c-3 5-8 9-16 11l-1 7H4V22zm22-8l10 3-2 2-6-1-4 6-3-1 3-7 2-2z"/>
        </svg>
        <span>Kinney Aviation</span>
      </a>
      <p class="rail-kicker">A&amp;P · Arizona</p>
      <nav class="rail-nav" aria-label="Shop">
        <a href="#briefing" data-nav="briefing">Briefing</a>
        <a href="#calendar" data-nav="calendar">Calendar</a>
        <a href="#records" data-nav="records">Records</a>
        <a href="#billing" data-nav="billing">Billing</a>
        <a href="#fleet" data-nav="fleet">Fleet</a>
        <a href="#present" data-nav="present">Present</a>
        <a href="#admin" data-nav="admin" hidden>Admin</a>
      </nav>
      <div class="rail-session" id="rail-session" hidden>
        <p class="rail-user" id="rail-user"></p>
        <p class="rail-role" id="rail-role"></p>
        <button type="button" class="rail-link" data-action="change-password">Password</button>
        <button type="button" class="rail-link" data-action="sign-out">Sign out</button>
      </div>
      <p class="rail-foot">
        Records, billing, and the sheet you hand the owner.
        <a href="https://nibrocsolutions.github.io/kinney-aviation/" target="_blank" rel="noopener">Public site</a>
      </p>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="eyebrow">Shop</p>
          <h1 id="view-title">Briefing</h1>
        </div>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <div id="banner" class="banner" hidden></div>
      <p id="flash" class="flash" hidden></p>
      <main id="view" aria-live="polite"></main>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <button type="button" class="modal-backdrop" data-action="close-modal" aria-label="Close dialog"></button>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <h2 id="modal-title">Edit</h2>
        <button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">×</button>
      </header>
      <form id="modal-form"></form>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
